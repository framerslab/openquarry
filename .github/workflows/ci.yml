name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# A newer push to a pull request cancels its older run; on master the running run finishes and only the newest
# waiting one is kept.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PLAYWRIGHT_VERSION: '1.65.1'

jobs:
  test:
    name: Types, tests, build and the packed files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        id: dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm test

      - name: Build
        run: npm run build

      - name: Check the documented validator command
        run: |
          npm install --no-save . ./packages/openquarry yaml
          node scripts/check-validator-command.mjs

      - name: Run the package page's examples from the packed checkout
        run: node scripts/check-package-examples.mjs

      - name: The files npm would publish
        run: npm pack --dry-run

  # The openquarry command (packages/openquarry): packed as npm would publish it, installed into an empty folder, and
  # every documented command run from that install. Node 18 is the oldest version the command supports.
  cli:
    name: The openquarry command, from its packed tarball (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [18, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Pack the command, install the tarball and run every command
        run: node scripts/check-cli.mjs

      - name: Check packed packages before a new library line reaches npm
        if: matrix.node == 22
        run: |
          npm pkg set version=999.0.0
          npm --prefix packages/openquarry pkg set version=999.0.0 'dependencies.@framers/openquarry=^999.0.0'
          node scripts/check-cli.mjs

  start:
    name: Start a project (the documented commands, against npm)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The commit the starters are copied from: the pull request's head (not the merge commit), or the pushed commit.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # Each starter is copied with npx degit into a fresh folder outside the checkout, installed from npm and checked.
      # On a pull request the copy is pinned to the pull request's head commit in the repository it comes from; on
      # master the commands run as written.
      - name: Copy, install and check each starter
        env:
          START_REF: ${{ github.event.pull_request.head.sha }}
          START_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: node scripts/check-start-commands.mjs

  site:
    name: The schema host (openquarry.dev)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # index.json names npm's newest library version (scripts/build-site.mjs, siteVersion).
      - name: Build the host
        env:
          OPENQUARRY_SITE_NPM_VERSION: '1'
        run: npm run site

      - name: The files the host serves
        run: find dist-site -type f | sort

      - name: Keep the build for the deploy
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist-site/
          retention-days: 30

      - name: Browser checks and screenshots (CI only)
        run: |
          npm install --no-save "playwright@$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium
          node scripts/check-site-browser.mjs

      - name: Keep browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-screenshots
          path: site-screenshots/
          if-no-files-found: ignore

  # Every green push to master goes live: the site artifact this run built is uploaded to the Cloudflare Pages project
  # behind openquarry.dev (openquarry-schema), then the host is read until it serves this commit. A run dispatched on
  # master deploys too (the release workflow starts one after a library release, so index.json follows npm);
  # a pull request deploys nothing. The token can edit Pages projects on the one account and nothing else.
  deploy-site:
    name: Deploy openquarry.dev
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [test, cli, start, site]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-site
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: The site this run built
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist-site

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # From dist-site, so wrangler finds functions/ beside site/.
      - name: Upload to Cloudflare Pages
        working-directory: dist-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.158.0 pages deploy site --project-name openquarry-schema --branch master --commit-hash "$GITHUB_SHA" --commit-message "ci run $GITHUB_RUN_ID" --commit-dirty=true

      # index.json names the commit the site was built from (scripts/build-site.mjs, builtFrom).
      - name: openquarry.dev serves this commit
        run: |
          for i in $(seq 1 24); do
            built=$(curl -fsS --max-time 10 "https://openquarry.dev/schema/v1/index.json?run=$GITHUB_RUN_ID-$i" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).builtFrom)}catch{console.log('')}})" || true)
            if [ "$built" = "$GITHUB_SHA" ]; then echo "openquarry.dev serves $GITHUB_SHA"; exit 0; fi
            sleep 5
          done
          echo "openquarry.dev serves ${built:-nothing readable}, not $GITHUB_SHA" >&2
          exit 1

  live-site:
    name: Compare live pages with the build
    needs: [deploy-site]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: site-screenshots
          path: site-screenshots

      - name: Capture openquarry.dev and compare with the build
        run: |
          npm install --no-save "playwright@$PLAYWRIGHT_VERSION" pngjs
          npx playwright install --with-deps chromium
          node scripts/check-site-browser.mjs --live

      - name: Keep live screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-site-screenshots
          path: live-site-screenshots/
          if-no-files-found: ignore
