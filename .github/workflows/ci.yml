name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# A newer push to a pull request cancels its older run; on master the running run finishes and only the newest
# waiting one is kept.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Types, tests, build and the packed files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check the documented validator command
        run: |
          npm install --no-save . yaml
          node scripts/check-validator-command.mjs

      - name: Run the package page's examples against the package from npm
        run: node scripts/check-package-examples.mjs

      - name: The files npm would publish
        run: npm pack --dry-run

  start:
    name: Start a project (the documented commands, against npm)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The commit the starters are copied from: the pull request's head (not the merge commit), or the pushed commit.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # Each starter is copied with npx degit into a fresh folder outside the checkout, installed from npm and checked.
      # On a pull request the copy is pinned to the pull request's head commit in the repository it comes from; on
      # master the commands run as written.
      - name: Copy, install and check each starter
        env:
          START_REF: ${{ github.event.pull_request.head.sha }}
          START_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: node scripts/check-start-commands.mjs

  site:
    name: The schema host (openquarry.dev)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build the host
        run: npm run site

      - name: The files the host serves
        run: find dist-site -type f | sort

      - name: Keep the build for the deploy
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist-site/
          retention-days: 30

      - name: Browser checks and screenshots (CI only)
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node scripts/check-site-browser.mjs

      - name: Keep browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-screenshots
          path: site-screenshots/
          if-no-files-found: ignore
