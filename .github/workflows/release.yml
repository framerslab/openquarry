name: release

# Publishes the package version in package.json to npm. Runs only by hand, never on a push.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @framers/openquarry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check and tests
        run: npm run typecheck && npm test

      - name: Build
        run: npm run build

      # Trusted publishing needs npm 11.5.1 or later.
      - name: npm 11.20.0 for trusted publishing
        run: npm install -g npm@11.20.0 && npm --version

      - name: Publish with provenance
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
