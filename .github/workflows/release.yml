name: release

# Publishes @framers/openquarry (the library, at the repository root) and openquarry (the command, in
# packages/openquarry) once a day, at 10:41 UTC, when master holds changes to a package's shipped files since its last
# release (the owner's word of 21 November 2026: daily automatic releases for these two packages), and by hand.
# scripts/release-bump.mjs finds what changed since each package's release tag (lib-v<version>, cli-v<version>) and
# writes the next version into the package.json of this checkout; nothing is committed. A day with no change ends at
# that step. Each published version tags the commit it came from, and the run then rebuilds openquarry.dev so its
# version badge names the new release.
on:
  schedule:
    - cron: '41 10 * * *'
  workflow_dispatch:

# One release at a time, and a release that has started is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  actions: write

jobs:
  publish:
    name: Publish the versions npm does not have
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Every commit and tag: the last releases are found by their tags.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: What changed since the last releases, and the versions they take
        id: bump
        run: node scripts/release-bump.mjs

      - name: Install dependencies
        if: steps.bump.outputs.release == 'true'
        run: npm install --no-audit --no-fund

      - name: Type check and tests
        if: steps.bump.outputs.release == 'true'
        run: npm run typecheck && npm test

      - name: Build
        if: steps.bump.outputs.release == 'true'
        run: npm run build

      # Trusted publishing needs npm 11.5.1 or later.
      - name: npm 11.20.0 for trusted publishing
        if: steps.bump.outputs.release == 'true'
        run: npm install -g npm@11.20.0 && npm --version

      # Fails when npm already serves both versions, and when the registry cannot be read.
      - name: Which versions are new
        if: steps.bump.outputs.release == 'true'
        id: plan
        run: node scripts/release-plan.mjs

      # Each new package is packed once. The files in this folder are the ones tested below and the ones published.
      - name: Pack each new package once
        if: steps.bump.outputs.release == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          if [ "${{ steps.plan.outputs.library }}" = "true" ]; then npm pack --pack-destination "$RUNNER_TEMP/release"; fi
          if [ "${{ steps.plan.outputs.command }}" = "true" ]; then (cd packages/openquarry && npm pack --pack-destination "$RUNNER_TEMP/release"); fi
          ls -l "$RUNNER_TEMP/release"

      - name: The openquarry command, run from the tarball that will be published
        if: steps.plan.outputs.command == 'true'
        run: node scripts/check-cli.mjs --tarballs "$RUNNER_TEMP/release"

      # The library has a trusted publisher bound to this workflow file. No token is given to this step, so a broken
      # trusted publisher fails here and is never papered over by a token.
      - name: Publish @framers/openquarry with provenance (trusted publisher)
        if: steps.plan.outputs.library == 'true'
        run: npm publish "$RUNNER_TEMP/release/framers-openquarry-${{ steps.plan.outputs.library_version }}.tgz" --access public --provenance

      # The commit this version came from, for the next day's comparison.
      - name: Tag the library release
        if: steps.plan.outputs.library == 'true'
        env:
          TAG: lib-v${{ steps.plan.outputs.library_version }}
        run: git tag "$TAG" "$GITHUB_SHA" && git push origin "refs/tags/$TAG"

      # openquarry depends on the library version just published.
      - name: Wait until npm serves the new library version
        if: steps.plan.outputs.library == 'true' && steps.plan.outputs.command == 'true'
        run: node scripts/release-plan.mjs --wait

      # The command has its own trusted publisher bound to this workflow file (set on npmjs.com on 21 November 2026, after
      # its first release went out with the token). No token is given to this step either, so a broken trusted
      # publisher fails here and is never papered over by a token.
      - name: Publish openquarry with provenance (trusted publisher)
        if: steps.plan.outputs.command == 'true'
        run: npm publish "$RUNNER_TEMP/release/openquarry-${{ steps.plan.outputs.command_version }}.tgz" --access public --provenance

      - name: Tag the command release
        if: steps.plan.outputs.command == 'true'
        env:
          TAG: cli-v${{ steps.plan.outputs.command_version }}
        run: git tag "$TAG" "$GITHUB_SHA" && git push origin "refs/tags/$TAG"

      # The site reads npm's `latest` tag for the library when it builds (scripts/build-site.mjs, siteVersion), and npm can
      # take a minute to move the tag to a version it has just accepted: wait for the tag itself, or the rebuild names the
      # version before (21 Nov 2026: 0.3.1 published, the badge kept 0.3.0). Asks every 10 seconds, 5 minutes at most.
      - name: Wait until npm's latest tag names the new library version, for the site
        if: steps.plan.outputs.library == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.library_version }}
        run: |
          for i in $(seq 1 30); do
            latest=$(npm view @framers/openquarry dist-tags.latest 2>/dev/null || true)
            if [ "$latest" = "$VERSION" ]; then echo "npm's latest is $VERSION"; exit 0; fi
            echo "npm's latest is ${latest:-unreadable}, waiting for $VERSION"; sleep 10
          done
          echo "npm's latest tag never named $VERSION within 5 minutes" >&2; exit 1

      # openquarry.dev shows the newest library version from npm: a fresh ci run on master builds and deploys it. It runs
      # after a library release even when the wait above failed (the run still ends red), so the site is never left behind.
      - name: Rebuild openquarry.dev
        if: ${{ !cancelled() && steps.plan.outputs.library == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref master
